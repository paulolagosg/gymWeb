services:
    laravel.test:
        build:
            context: './docker/8.4'
            dockerfile: Dockerfile
            args:
                WWWGROUP: '${WWWGROUP:-20}'
                NODE_VERSION: '${NODE_VERSION:-22.14.0}'
                INSTALL_EXTRA_TOOLS: '${DOCKER_INSTALL_EXTRA_TOOLS:-false}'
                INSTALL_POSTGRES_SUPPORT: '${DOCKER_INSTALL_POSTGRES_SUPPORT:-false}'
                INSTALL_EXTRA_PHP_EXTENSIONS: '${DOCKER_INSTALL_EXTRA_PHP_EXTENSIONS:-false}'
        image: 'sail-8.4/app'
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        ports:
            - '9999:80'
            - '${VITE_PORT:-5173}:${VITE_PORT:-5173}'
        environment:
            WWWUSER: '${WWWUSER:-501}'
            LARAVEL_SAIL: 1
            XDEBUG_MODE: '${SAIL_XDEBUG_MODE:-off}'
            XDEBUG_CONFIG: '${SAIL_XDEBUG_CONFIG:-client_host=host.docker.internal}'
            IGNITION_LOCAL_SITES_PATH: '/var/www/html/private'
            SUPERVISOR_PHP_COMMAND: '/usr/bin/php -d variables_order=EGPCS -S 0.0.0.0:80 -t /var/www/html /var/www/html/router.php'
        working_dir: '/var/www/html/private'
        volumes:
            - '..:/var/www/html'
            - './public/build:/var/www/html/build'
        networks:
            - sail
        depends_on:
            - mysql
    mysql:
        image: 'mysql/mysql-server:8.0'
        ports:
            - '3766:3306'
        environment:
            MYSQL_ROOT_PASSWORD: '${DB_PASSWORD}'
            MYSQL_ROOT_HOST: '%'
            MYSQL_DATABASE: '${DB_DATABASE}'
            MYSQL_USER: '${DB_USERNAME}'
            MYSQL_PASSWORD: '${DB_PASSWORD}'
            MYSQL_ALLOW_EMPTY_PASSWORD: 0
        volumes:
            - 'sail-mysql:/var/lib/mysql'
            - './vendor/laravel/sail/database/mysql/create-testing-database.sh:/docker-entrypoint-initdb.d/10-create-testing-database.sh'
        networks:
            - sail
        healthcheck:
            test:
                - CMD
                - mysqladmin
                - ping
                - '-p${DB_PASSWORD}'
            retries: 3
            timeout: 5s
networks:
    sail:
        driver: bridge
volumes:
    sail-mysql:
        driver: local
